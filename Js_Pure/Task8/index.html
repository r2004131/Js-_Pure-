<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Word Counter</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 min-h-screen text-white flex items-center justify-center antialiased p-4">

  <div class="bg-slate-800/60 backdrop-blur-md border border-slate-700 rounded-2xl shadow-2xl p-6 w-full max-w-lg">

    <h1 class="text-2xl font-bold mb-1">عدّاد الكلمات</h1>
    <p class="text-slate-400 text-sm mb-4">اكتب في الصندوق تحت</p>

    <!-- Textarea -->
    <textarea id="text-input"
              rows="6"
              placeholder="اكتب هنا..."
              class="w-full bg-slate-900 border border-slate-700 rounded-xl p-4 resize-none outline-none focus:ring-2 focus:ring-amber-500 transition text-white"></textarea>

    <!-- الإحصائيات -->
    <div class="grid grid-cols-2 gap-4 mt-4">

      <div class="bg-slate-900/70 rounded-xl p-4 text-center border border-slate-700">
        <div class="text-slate-400 text-xs mb-1">الكلمات</div>
        <div id="word-count" class="text-3xl font-bold text-amber-400">0</div>
      </div>

      <div class="bg-slate-900/70 rounded-xl p-4 text-center border border-slate-700">
        <div class="text-slate-400 text-xs mb-1">الحروف</div>
        <div id="char-count" class="text-3xl font-bold text-emerald-400">0</div>
      </div>

    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
