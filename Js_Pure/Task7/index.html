<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dark / Light Mode</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body id="body" class="bg-white text-slate-900 min-h-screen flex items-center justify-center transition-colors duration-300 antialiased">

  <div class="text-center">

    <div id="icon" class="text-6xl mb-4 transition-all duration-300">☀️</div>

    <h1 class="text-3xl font-bold mb-2">الوضع الحالي</h1>
    <p id="mode-text" class="text-slate-500 mb-8">Light Mode</p>

    <button id="toggle-btn"
            class="px-6 py-3 rounded-xl font-semibold bg-slate-900 text-white hover:bg-slate-700 transition shadow-lg">
      تبديل الوضع
    </button>

  </div>

  <script src="script.js"></script>
</body>
</html>
