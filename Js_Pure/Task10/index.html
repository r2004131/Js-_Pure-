<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search Filter</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 min-h-screen text-white flex items-center justify-center antialiased p-4">

  <div class="bg-slate-800/60 backdrop-blur-md border border-slate-700 rounded-2xl shadow-2xl p-6 w-full max-w-md">

    <h1 class="text-2xl font-bold mb-1">بحث في الأسماء</h1>
    <p class="text-slate-400 text-sm mb-4">اكتب حرف أو اسم</p>

    <!-- حقل البحث -->
    <input id="search-input"
           type="text"
           placeholder="ابحث..."
           class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 mb-4 outline-none focus:ring-2 focus:ring-amber-500 transition" />

    <!-- القائمة -->
    <ul id="names-list" class="space-y-2 max-h-80 overflow-y-auto pr-1"></ul>

    <!-- رسالة لا توجد نتائج -->
    <p id="no-results" class="hidden text-center text-slate-400 text-sm mt-4">
      لا توجد نتائج
    </p>

  </div>

  <script src="script.js"></script>
</body>
</html>
